<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="auto" style="background:#fcf9f2; font-family:'Pretendard', 'Noto Sans KR', sans-serif;">
  <defs>
    <filter id="mapShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="#eaf2f8"/>
  <!-- Landmass -->
  <path d="M 50 50 L 950 50 L 950 550 Q 850 520 800 600 Q 600 620 500 550 Q 400 500 250 580 L 50 550 Z" fill="#faf6ed" stroke="#d5c7b0" stroke-width="2"/>

  <!-- Title -->
  <g transform="translate(60, 40)">
    <rect width="460" height="65" rx="6" fill="#ffffff" opacity="0.92" stroke="#8b2500" stroke-width="1.5"/>
    <text x="20" y="28" font-size="18" font-weight="bold" fill="#8b2500">남송(만지) 강남 수운망과 킨사이(항저우) 항로</text>
    <text x="20" y="48" font-size="12" fill="#555">양쯔강(대강), 대운하, 1만 2천 개의 다리가 있던 지상낙원 킨사이</text>
  </g>

  <!-- Yellow River (황하 / 카라모란) -->
  <path d="M 50 180 Q 200 160 350 210 Q 500 260 700 200 Q 820 180 900 190" fill="none" stroke="#d4a373" stroke-width="5"/>
  <text x="380" y="195" font-size="13" font-weight="bold" fill="#a0522d">카라모란 (황하 / 黃河)</text>

  <!-- Yangtze River (양쯔강 / 대강) -->
  <path d="M 50 370 Q 250 350 450 390 Q 650 430 820 370 Q 900 350 950 360" fill="none" stroke="#4a90e2" stroke-width="7"/>
  <text x="460" y="375" font-size="14" font-weight="bold" fill="#1d5f99">키앙 대강 (양쯔강 / 揚子江) "폭이 10마일에 달하는 세계 최대의 강"</text>

  <!-- Grand Canal (경항대운하) -->
  <path d="M 750 110 L 760 210 L 780 370 L 800 460" fill="none" stroke="#2e8b57" stroke-width="4" stroke-dasharray="6,3"/>
  <text x="790" y="270" font-size="12" font-weight="bold" fill="#2e8b57">대운하 (쿠빌라이 칸 완성)</text>

  <!-- Key Cities -->
  <!-- Dadu -->
  <circle cx="750" cy="110" r="7" fill="#8b2500" stroke="#fff" stroke-width="2"/>
  <text x="670" y="105" font-size="13" font-weight="bold" fill="#8b2500">대도 (북경)</text>

  <!-- Lugou Bridge -->
  <circle cx="720" cy="130" r="4" fill="#333"/>
  <text x="630" y="140" font-size="11" fill="#333">노구교 (루거우차오)</text>

  <!-- Xi'an -->
  <circle cx="360" cy="270" r="5" fill="#333"/>
  <text x="290" y="275" font-size="12" font-weight="bold" fill="#333">경조부 (시안 / 서안)</text>

  <!-- Chengdu -->
  <circle cx="180" cy="380" r="5" fill="#333"/>
  <text x="110" y="385" font-size="12" font-weight="bold" fill="#333">성도 (신딩푸 / 청두)</text>

  <!-- Kinsay (Hangzhou) -->
  <g transform="translate(800, 460)">
    <circle cx="0" cy="0" r="9" fill="#b22222" stroke="#fff" stroke-width="2.5" filter="url(#mapShadow)"/>
    <text x="15" y="5" font-size="16" font-weight="bold" fill="#b22222">킨사이 (행재 / 항저우)</text>
    <text x="15" y="23" font-size="11" fill="#666">"둘레 100마일, 12,000개의 다리, 서호와 대궁전"</text>
  </g>

  <!-- Zayton (Quanzhou) -->
  <g transform="translate(780, 560)">
    <circle cx="0" cy="0" r="8" fill="#1e5f8a" stroke="#fff" stroke-width="2"/>
    <text x="15" y="5" font-size="14" font-weight="bold" fill="#1e5f8a">자이톤 (천주 / 泉州)</text>
    <text x="15" y="22" font-size="11" fill="#555">"알렉산드리아의 100배에 달하는 후추 무역항"</text>
  </g>

  <!-- West Lake Detail Inset -->
  <g transform="translate(60, 440)">
    <rect width="250" height="160" rx="6" fill="#ffffff" opacity="0.95" stroke="#4a90e2" stroke-width="1.5" filter="url(#mapShadow)"/>
    <text x="15" y="24" font-size="13" font-weight="bold" fill="#1d5f99">킨사이 서호(西湖) 상세</text>
    <path d="M 40 60 Q 90 40 140 70 Q 180 110 130 140 Q 70 140 40 100 Z" fill="#d4eaf7" stroke="#4a90e2" stroke-width="1.5"/>
    <circle cx="80" cy="90" r="6" fill="#4a7c59"/><text x="90" y="93" font-size="9" fill="#2d5036">고산도</text>
    <circle cx="120" cy="100" r="5" fill="#4a7c59"/><text x="128" y="103" font-size="9" fill="#2d5036">소영주</text>
    <text x="15" y="150" font-size="10" fill="#666">유람선과 호화 궁정이 즐비했던 호수</text>
  </g>
</svg>